<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Authentification - TalentSoft</title></head>
<body>
  <!-- Formulaire de l'IdP : noms de champs relevés sur le tenant réel. -->
  <h1>Saisissez vos informations de connexion pour accéder à Talentsoft</h1>
  <form method="post" action="https://idp-fake.talent-soft.com/wsfed/issue">
    <input type="hidden" name="__RequestVerificationToken" value="jeton">
    <input type="hidden" name="ReturnUrl" id="ReturnUrl" value="/">
    <label for="Username">Nom d'utilisateur</label>
    <input type="text" name="Username" id="Username" class="form-control">
    <label for="Password">Mot de passe</label>
    <input type="password" name="Password" id="Password" class="form-control">
    <input type="checkbox" name="RememberMe" id="RememberMe" class="form-check-input">
    <label for="RememberMe">Maintenir la connexion</label>
    <button type="submit" class="btn btn-primary">Connexion</button>
  </form>
  <div class="validation-summary-errors" style="display:none">Identifiants incorrects</div>
<script>
  // Reproduit le comportement constate sur l'IdP du tenant : le clic sur le bouton ne
  // declenche PAS la soumission. Entree et requestSubmit(), eux, fonctionnent.
  window.__neutraliseBouton = true;
  document.querySelector("button[type='submit']").addEventListener('click', function (e) {
    e.preventDefault();
  });
</script>
</body>
</html>

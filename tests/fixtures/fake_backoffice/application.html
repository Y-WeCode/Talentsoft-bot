<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Candidature</title>
<style>.hidden{display:none} dialog{border:1px solid #999}</style></head>
<body>
<header><a href="/Account/LogOff">Se déconnecter</a></header>
<h1>Candidature de Jean Test</h1>
<div role="tablist">
  <button role="tab" id="tabProfil">Profil</button>
  <button role="tab" id="tabHistorique">Historique</button>
  <button role="tab" id="tabPieces">Pièces jointes</button>
</div>

<section id="panelHistorique" class="hidden">
  <button id="addEvent">Ajouter un événement</button>
  <ul class="historique" id="historyList">
    <li>01/09/2026 Candidature reçue</li>
  </ul>
</section>

<section id="panelPieces" class="hidden">
  <button id="addAttachment">Ajouter une pièce jointe</button>
  <form id="attachmentForm" class="hidden">
    <input type="file" id="file" name="file">
    <label for="cat">Catégorie</label>
    <select id="cat" name="category"><option value="1">CV</option><option value="2">Lettre de motivation</option><option value="3">Autre</option></select>
    <label for="docName">Nom</label>
    <input id="docName" name="name">
    <button type="submit">Enregistrer</button>
  </form>
  <ul class="documents" id="docList">
    <li>CV_initial.pdf (CV)</li>
  </ul>
</section>

<dialog id="eventDialog">
  <form method="dialog" id="eventForm">
    <label for="eventType">Type d'événement</label>
    <select id="eventType" name="eventType"><option value="">--</option><option value="10">Commentaire</option><option value="20">Entretien téléphonique</option></select>
    <label for="eventComment">Commentaire</label>
    <textarea id="eventComment" name="comment"></textarea>
    <label for="eventDate">Date</label>
    <input id="eventDate" type="date" name="date">
    <button type="submit" value="ok">Enregistrer</button>
  </form>
</dialog>

<script>
function show(id){ ['panelHistorique','panelPieces'].forEach(function(p){ document.getElementById(p).classList.add('hidden'); }); document.getElementById(id).classList.remove('hidden'); }
document.getElementById('tabHistorique').onclick = function(){ show('panelHistorique'); };
document.getElementById('tabPieces').onclick = function(){ show('panelPieces'); };
document.getElementById('addEvent').onclick = function(){ document.getElementById('eventDialog').showModal(); };
document.getElementById('eventForm').addEventListener('submit', function(){
  var type = document.getElementById('eventType');
  var label = type.options[type.selectedIndex].text;
  var li = document.createElement('li');
  li.textContent = (document.getElementById('eventDate').value || 'aujourd\'hui') + ' ' + label + ' : ' + document.getElementById('eventComment').value;
  document.getElementById('historyList').prepend(li);
  document.getElementById('eventComment').value = '';
});
document.getElementById('addAttachment').onclick = function(){ document.getElementById('attachmentForm').classList.remove('hidden'); };
document.getElementById('attachmentForm').addEventListener('submit', function(e){
  e.preventDefault();
  var f = document.getElementById('file').files[0];
  var cat = document.getElementById('cat');
  var li = document.createElement('li');
  li.textContent = (document.getElementById('docName').value || (f && f.name)) + ' (' + cat.options[cat.selectedIndex].text + ')';
  document.getElementById('docList').appendChild(li);
  document.getElementById('attachmentForm').classList.add('hidden');
});
</script>
</body></html>

services:
  redis:
    image: redis:7-alpine
    container_name: talentsoft_bot_redis
    # Port non publié : api et worker joignent redis par le réseau Compose interne.
    restart: unless-stopped
    profiles:
      - async

  api:
    build: .
    container_name: talentsoft_bot_api
    # API_HOST_PORT dans .env pour une seconde instance sur le même hôte (Compose concatène
    # les listes de ports d'un override au lieu de les remplacer).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-42201}:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-}
      TS_ASYNC_JOBS_ENABLED: ${TS_ASYNC_JOBS_ENABLED:-false}
      HEADLESS_MODE: "true"
    volumes:
      - ./logs:/app/logs
      - ./traces:/app/traces
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  worker:
    build: .
    container_name: talentsoft_bot_worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TS_ASYNC_JOBS_ENABLED: "true"
      HEADLESS_MODE: "true"
    volumes:
      - ./logs:/app/logs
      - ./traces:/app/traces
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - redis
      - api
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    profiles:
      - async

services:
  redis:
    image: redis:7-alpine
    container_name: talentsoft_bot_redis
    # Port non publié : api et worker joignent redis par le réseau Compose interne.
    # Alias explicite : sur un hôte qui héberge plusieurs projets, le nom générique « redis »
    # peut désigner le Redis d'un voisin — le bot lui parlerait sans le savoir.
    networks:
      default:
        aliases:
          - talentsoft_bot_redis
    restart: unless-stopped
    profiles:
      - async

  api:
    build: .
    container_name: talentsoft_bot_api
    # API_HOST_PORT dans .env pour une seconde instance sur le même hôte (Compose concatène
    # les listes de ports d'un override au lieu de les remplacer).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-42201}:8000"
    env_file:
      - .env
    environment:
      # Vide = mode synchrone. Sinon viser le conteneur par SON nom (voir l alias du service
      # redis) : sur un hote partage, « redis » peut designer le Redis d un voisin.
      REDIS_URL: ${REDIS_URL:-}
      TS_ASYNC_JOBS_ENABLED: ${TS_ASYNC_JOBS_ENABLED:-false}
      HEADLESS_MODE: "true"
    volumes:
      - ./logs:/app/logs
      - ./traces:/app/traces
      - ./data:/app/data
      - ./uploads:/app/uploads
      # State PROPRE a l'api, et inutilise des que le worker est la : deux navigateurs qui
      # partagent le meme storage_state s'ecrasent les cookies l'un de l'autre, et le tenant
      # n'admet de toute facon qu'une session par compte. Voir ARCHITECTURE.md.
      - ./state-api:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Chromium plus Python, sur une session qui vit desormais deux heures d'affilee. A 2 Go, le
    # noyau tuait le renderer en cours de job — constate deux fois le 24/09, « Page crashed » puis
    # une assertion du pilote. Une limite n'est pas une reservation : la lever ne coute rien tant
    # qu'elle n'est pas atteinte. Le plafond qui compte est celui du service qui possede le
    # navigateur, lequel depend de TS_ASYNC_JOBS_ENABLED : on leve donc les deux.
    shm_size: "2gb"
    mem_limit: 6g
    cpus: 2.0
    restart: unless-stopped

  # Proprietaire UNIQUE du navigateur quand le profil « async » est actif. Dans ce cas l'api
  # DOIT avoir TS_ASYNC_JOBS_ENABLED=true, sinon elle ouvrirait son propre Chromium en plus de
  # celui-ci : deux sessions sur le meme compte technique, qui se deconnectent mutuellement.
  # L'api journalise un avertissement si la configuration est incoherente.
  worker:
    build: .
    container_name: talentsoft_bot_worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      # Nom du conteneur, pas le nom generique : voir l'alias du service redis.
      # Surchargeable par .env pour pointer un Redis externe.
      REDIS_URL: ${REDIS_URL:-redis://talentsoft_bot_redis:6379/0}
      TS_ASYNC_JOBS_ENABLED: "true"
      HEADLESS_MODE: "true"
    volumes:
      - ./logs:/app/logs
      - ./traces:/app/traces
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - redis
    # Sante fondee sur la fraicheur du battement publie dans Redis : un worker vivant mais
    # incapable d'ecrire dans Redis est aussi inutile qu'un worker mort.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from app import jobs; sys.exit(0 if jobs.read_worker_status() else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Chromium plus Python, sur une session qui vit desormais deux heures d'affilee. A 2 Go, le
    # noyau tuait le renderer en cours de job — constate deux fois le 24/09, « Page crashed » puis
    # une assertion du pilote. Une limite n'est pas une reservation : la lever ne coute rien tant
    # qu'elle n'est pas atteinte. Le plafond qui compte est celui du service qui possede le
    # navigateur, lequel depend de TS_ASYNC_JOBS_ENABLED : on leve donc les deux.
    shm_size: "2gb"
    mem_limit: 6g
    cpus: 2.0
    restart: unless-stopped
    profiles:
      - async
